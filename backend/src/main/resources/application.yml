spring:
  application:
    name: project-pulse
  profiles:
    active: dev # By default, the active profile is "dev". During production, it will be replaced to "prod" due to Azure's environment variables.
  #  web:
  #    resources:
  #      add-mappings: false
  devtools:
    livereload:
      enabled: true
  flyway:
    enabled: true
    baseline-on-migrate: true # On an existing schema, baseline at V1 so Flyway won’t rerun V1; on a fresh DB, V1 will execute.
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
server:
  port: 80
api:
  endpoint:
    base-url: /api/v1
ram:
  lock:
    default-lock-ttl: PT15M # 15 minutes, adjust as needed based on expected operation duration and load.
# Baseline for every profile: expose only what a deployed environment has a consumer for.
# The platform health probe needs `health`; `info` carries the build and version. Everything else
# (env, configprops, heapdump, loggers, httpexchanges, beans, mappings, metrics, prometheus) is
# opened per profile, so a profile that forgets to override this inherits the safe set rather than
# the full one. The dev profile opens the rest. See TD-1 in docs/design/architectural-design.md.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized # Anonymous callers (the platform probe) see only {"status":"UP"}.
      roles: admin # Who counts as "authorized" for the line above.
      probes:
        enabled: true # Since Spring Boot 4, liveness and readiness probes are enabled by default.
  # /actuator/info is anonymous (the only exposed endpoint besides health), so it is trimmed to what
  # is safe to publish. `simple` git mode is branch, commit id and commit time, enough to identify the
  # deployed build; `full` publishes the whole git.properties, including committer and build-user
  # names and emails, the remote URL and the build host. The java and os blocks are off because an
  # exact JVM and OS version tells an anonymous caller which CVEs to try. The dev profile restores
  # all three. `env` here exposes only the `info.*` properties below, which are deliberately public.
  info:
    build:
      enabled: true
    env:
      enabled: true
    git:
      enabled: true
      mode: simple
    java:
      enabled: false
    os:
      enabled: false
  tracing:
    sampling:
      probability: 0.1 # Sample 10% of traces to bound trace volume; raise toward 1.0 in dev/demo for full visibility.
info:
  app:
    name: project-pulse
    description: Project Pulse is a web application designed to track student contributions and peer evaluations in senior design or capstone projects, fostering better team collaboration and accountability.
    version: "@project.version@"
    author: Bingyang Wei
    links:
      youtube: https://youtube.com/@BingyangWei
      github: https://github.com/Washingtonwei/project-pulse
