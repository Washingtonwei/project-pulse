spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources[0]:
            endpoint: ${AZURE_KEY_VAULT_ENDPOINT} # environment variable
  datasource:
    url: ${datasource-url} # secret from Azure Key Vault
    username: ${datasource-username} # secret from Azure Key Vault
    password: ${datasource-password} # secret from Azure Key Vault
  jpa:
    hibernate:
      ddl-auto: none # Turn off the DDL auto generation.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${email-username}
    password: ${email-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # JavaMail waits forever by default. Bound each blocking SMTP operation (connect, read, write) so a
          # mail server that stops answering fails one reminder instead of holding the request open (design/not.md)
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
front-end:
  url: https://projectpulse.team
app:
  timezone: America/Chicago
  reminders:
    enabled: true
    cron: "0 0 8 * * *"  # 8am local time

# No Zipkin runs on Azure, so exporting spans only drops them after one startup warning. Brave still puts
# [traceId-spanId] on every log line; Application Insights collects telemetry through its agent (TD-prod-observability).
management:
  tracing:
    export:
      zipkin:
        enabled: false

# The AI proxy's provider (team.projectpulse.ram.llm, docs/design/ai.md). The key is the Key Vault secret
# `openai-api-key`; the trailing colon gives it an empty default, so a vault without that secret still
# starts, and every AI call answers NOT_CONFIGURED. AI turns on only when both the key and the model are
# set. Before putting the key in Key Vault, set a monthly budget on the OpenAI account (docs/design/ai.md).
ai:
  llm:
    provider: openai
    openai:
      api-key: ${openai-api-key:}
      model: # Left blank on purpose until chosen at deploy; blank means NOT_CONFIGURED.
