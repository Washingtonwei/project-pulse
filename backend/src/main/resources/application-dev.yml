spring:
  datasource:
    url: jdbc:mysql://localhost:3306/project-pulse
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
  mail:
    host: localhost
    port: 1025
    username: admin@project-pulse.team
front-end:
  url: http://localhost:5173
app:
  timezone: America/Chicago
  reminders:
    enabled: false # Disable email reminders in the dev profile
    cron: "0 0 8 * * *"  # 8am local time

# Dev runs on localhost against seeded data and throwaway credentials, so the full actuator surface
# is open here for teaching and debugging. Deployed profiles inherit the safe baseline in
# application.yml instead. Never copy this block into prod or staging.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,heapdump,httpexchanges,loggers,mappings,custom-beans,prometheus
  endpoint:
    health:
      show-details: always
    env:
      show-values: always
    configprops:
      show-values: always
  info:
    git:
      mode: full
    java:
      enabled: true
    os:
      enabled: true
