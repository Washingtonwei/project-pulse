title: "Software Requirements Specification"

sections:

  - sectionKey: "INTRODUCTION"
    title: "Introduction"
    type: "RICH_TEXT"
    guidance: |
      The Introduction orients the reader and makes the SRS self-contained. It is framing, not the requirements themselves: a reader should learn what the system is, what this document covers, the conventions it uses, and where related material lives — then know where the actual requirements begin. Keep it brief; the substance belongs to the sections that follow.

      It includes:
      - The Purpose of the Project — a brief summary of the system and who it serves
      - The Purpose of this Document — what this SRS specifies and how it is organized
      - Document Conventions — identifier schemes and notations used here
      - References — the related documents this SRS relies on

      Unlike the body, the Introduction may briefly restate context from a companion document (notably the Vision and Scope) so a developer or tester can read the SRS on its own — but only as a summary that points to the source, never a copy of it.

  - sectionKey: "SYSTEM_PURPOSE"
    title: "The Purpose of the Project"
    type: "RICH_TEXT"
    guidance: |
      Summarize what the system is for: who uses it and why. Keep it to a short orientation — name the product, its major capability areas, and its primary users.

      Address briefly:
      - Who will use the system
      - The business motivation behind it
      - Why this system is needed

      This is the one place the SRS deliberately reiterates the Vision and Scope, so a reader who has not seen that document still understands the system. Reiterate concisely and point to the Vision and Scope for the full problem, opportunity, objectives, and scope — summarize it here, don't reproduce the business case.

      **Example:**
      "The Cafeteria Ordering System (COS) lets employees of Process Impact order meals online for delivery within the company campus, replacing the walk-up cafeteria line and phone-in orders. Its users are employees placing orders, cafeteria staff fulfilling them, and the meal-delivery drivers. The full business motivation — the problem, opportunity, objectives, and scope — is defined in the Vision and Scope document and is referenced here rather than repeated."

  - sectionKey: "DOCUMENT_PURPOSE"
    title: "The Purpose of this Document"
    type: "RICH_TEXT"
    guidance: |
      Specify the purpose of this Software Requirements Specification.

      The SRS should:
      - Fully describe the external behavior of the system
      - Describe functional and nonfunctional requirements
      - Identify constraints and other relevant factors

      The goal is to provide a complete and unambiguous reference for developers, testers, and stakeholders.

  - sectionKey: "DOCUMENT_CONVENTIONS"
    title: "Document Conventions"
    type: "RICH_TEXT"
    guidance: |
      Describe any standards or typographical conventions used in this document.

      Examples include:
      - Requirement identifier formats
      - Text styles and highlighting conventions
      - Notations used in diagrams or tables

  - sectionKey: "REFERENCES"
    title: "References"
    type: "RICH_TEXT"
    guidance: |
      List any documents or resources referenced by this SRS.

      For each reference include:
      - Title
      - Author
      - Version
      - Date
      - Source or URL

      Examples:
      - Vision and Scope document
      - Use Case specification
      - Glossary
      - UI wireframes
      - Standards or regulations

  - sectionKey: "OVERALL_DESCRIPTION"
    title: "Overall Description"
    type: "RICH_TEXT"
    guidance: |
      The Overall Description sets the context the requirements are written in: where the product sits, who uses it, the environment it runs in, and the constraints and assumptions it is built under. Keep this section to a sentence of orientation; the substance belongs to the sections that follow.

      It includes:
      - Product Perspective: how the system relates to other systems and its users' environment
      - User Classes and Characteristics: the kinds of user, and what tells them apart
      - Operating Environment: the platforms and services the system runs within
      - Design and Implementation Constraints: the limits on the solution
      - Assumptions and Dependencies: what the requirements take for granted

  - sectionKey: "PRODUCT_PERSPECTIVE"
    title: "Product Perspective"
    type: "RICH_TEXT"
    guidance: |
      Describe how this system relates to other systems and to its users' environment.

      Address:
      - Whether it is self-contained, or one component of something larger
      - The other systems it interacts with, and the interfaces between them

      Refer to the Vision and Scope's Product Perspective and to the Architectural Design's Context and Scope rather than redrawing their diagrams.

  - sectionKey: "USER_CLASSES"
    title: "User Classes and Characteristics"
    type: "RICH_TEXT"
    guidance: |
      Describe the kinds of user and what distinguishes them.

      For each user class include:
      - How often they use the system
      - Their technical skill
      - Their privilege level: what they may see and do
      - Whether they are inside or outside the client's organization

      Refer to the Vision and Scope's Stakeholder Profiles for who they are. What belongs here is what affects the software's behavior, especially permissions.

  - sectionKey: "OPERATING_ENVIRONMENT"
    title: "Operating Environment"
    type: "LIST"
    artifactTypes: ["OPERATING_ENVIRONMENT"]
    guidance: |
      Describe the environment in which the software will operate, one fact per item, so each can be checked and traced.

      Consider:
      - Hardware platforms
      - Operating systems and browsers
      - User locations
      - Server and database locations
      - Coexisting software systems

      **Example:**
      - OE-supported-browsers: The system shall run in current versions of Chrome, Firefox, Edge and Safari.
      - OE-company-data-center: The system's server and database shall be hosted in the company's data center.

  - sectionKey: "DESIGN_CONSTRAINTS"
    title: "Design and Implementation Constraints"
    type: "LIST"
    artifactTypes: ["CONSTRAINT"]
    guidance: |
      Describe factors that limit implementation choices.

      Examples:
      - Regulatory or corporate policies
      - Hardware limitations
      - Required technologies or programming languages
      - Coding or documentation standards

  - sectionKey: "ASSUMPTIONS_DEPENDENCIES"
    title: "Assumptions and Dependencies"
    type: "LIST"
    artifactTypes: ["ASSUMPTION", "DEPENDENCY"]
    guidance: |
      List assumptions believed to be true without definitive proof.

      Also list dependencies on:
      - External systems
      - Third-party libraries or services
      - External teams or organizations

      Explain the impact if assumptions prove false or dependencies fail.

  - sectionKey: "PROJECT_GLOSSARY"
    title: "Project Glossary"
    type: "RICH_TEXT"
    guidance: |
      Define terminology specific to the problem domain.

      This section is a shared vocabulary for stakeholders. The data's fields belong in Data Dictionary, not here.

      It is often provided by reference to a separate Glossary document.

  - sectionKey: "VISION_SCOPE_REFERENCE"
    title: "Vision and Scope"
    type: "RICH_TEXT"
    guidance: |
      Link to the Vision and Scope document.

      This section should explain:
      - Where the Vision and Scope document can be found
      - How it informs the requirements in this SRS

  - sectionKey: "FUNCTIONAL_REQUIREMENTS"
    title: "Functional Requirements"
    type: "RICH_TEXT"
    guidance: |
      Describe all functional requirements in sufficient detail for design and testing.

      This section should enable:
      - Designers to design the system
      - Testers to verify the system

  - sectionKey: "USE_CASES"
    title: "Use Cases"
    type: "RICH_TEXT"
    guidance: |
      Provide or link to the Use Case Specification document.

      This section should describe how users interact with the system to achieve goals.

  - sectionKey: "NON_USE_CASE_FUNCTIONAL_REQUIREMENTS"
    title: "Non-Use Case Functional Requirements"
    type: "LIST"
    artifactTypes: ["FUNCTIONAL_REQUIREMENT"]
    guidance: |
      Describe functional requirements that are not easily expressed as use cases.

      Use structured formats such as:
      - "The system shall…" statements
      - EARS (Easy Approach to Requirements Syntax)

  - sectionKey: "BUSINESS_RULES"
    title: "Business Rules"
    type: "RICH_TEXT"
    guidance: |
      Business rules are authored in the team's Business Rules document, not here. Use this section to point to that document and say how the rules shape the requirements in this SRS.

  - sectionKey: "DATA_REQUIREMENTS"
    title: "Data Requirements"
    type: "LIST"
    artifactTypes: ["DATA_REQUIREMENT"]
    guidance: |
      Describe the data the system consumes, processes, or produces, one requirement per item.

      Consider:
      - What data is stored, and its format
      - Where it comes from and who may change it

      Each entity's fields go in Data Dictionary, and the reports the system produces in Reports.

      **Example:**
      - DI-order-details: The system shall store each order's items, price, delivery location and requested delivery time.

  - sectionKey: "BUSINESS_DOMAIN_MODEL"
    title: "Business Domain Model"
    type: "RICH_TEXT"
    guidance: |
      Describe the key concepts and relationships within the business domain.

      Domain models are typically expressed as UML class diagrams.

  - sectionKey: "DATA_DICTIONARY"
    title: "Data Dictionary"
    type: "RICH_TEXT"
    guidance: |
      Define each entity's fields.

      For each field include:
      - Data type
      - Allowed values
      - Default
      - Validation rules

      Where a use case already specifies a field's validation in its Associated Information, cite the use case instead of repeating it.

  - sectionKey: "REPORTS"
    title: "Reports"
    type: "RICH_TEXT"
    guidance: |
      Describe every report the system generates.

      For each report include:
      - Who reads it
      - What it contains
      - How often it is produced
      - Its format

      Reports are where clients discover late that a field they need was never captured, so specify them early.

  - sectionKey: "DATA_LIFECYCLE"
    title: "Data Acquisition, Integrity, Retention, and Disposal"
    type: "RICH_TEXT"
    guidance: |
      Describe how data is acquired, protected, retained, and disposed of.

      Include:
      - Retention policies
      - Backup and recovery
      - Integrity safeguards

  - sectionKey: "EXTERNAL_INTERFACES"
    title: "External Interface Requirements"
    type: "RICH_TEXT"
    guidance: |
      Describe how the system communicates with users and external systems.

  - sectionKey: "USER_INTERFACES"
    title: "User Interfaces"
    type: "LIST"
    artifactTypes: ["USER_INTERFACE"]
    guidance: |
      Describe logical characteristics of user interfaces.

      Include:
      - UI standards
      - Accessibility requirements
      - Navigation and interaction constraints

  - sectionKey: "HARDWARE_INTERFACES"
    title: "Hardware Interfaces"
    type: "LIST"
    artifactTypes: ["HARDWARE_INTERFACE"]
    guidance: |
      Describe each interface between the software and a hardware component, one per item. Leave the list empty if the system has none.

      Include:
      - The device and what it is used for
      - The data exchanged and how

  - sectionKey: "SOFTWARE_INTERFACES"
    title: "Software Interfaces"
    type: "LIST"
    artifactTypes: ["SOFTWARE_INTERFACE"]
    guidance: |
      Describe interactions with other software systems.

      Include:
      - Data exchanged
      - Communication protocols
      - Security considerations

  - sectionKey: "API_DOCUMENTATION"
    title: "API Document"
    type: "RICH_TEXT"
    guidance: |
      Link to the API documentation describing endpoints, inputs, outputs, and error handling.

  - sectionKey: "COMMUNICATION_INTERFACES"
    title: "Communications Interfaces"
    type: "LIST"
    artifactTypes: ["COMMUNICATIONS_INTERFACE"]
    guidance: |
      Describe communication requirements such as email, messaging, and network protocols.

      Include:
      - Security
      - Data transfer rates
      - Formatting constraints

  - sectionKey: "QUALITY_ATTRIBUTES"
    title: "Quality Attributes"
    type: "LIST"
    artifactTypes: ["QUALITY_ATTRIBUTE"]
    guidance: |
      Describe quality attributes such as usability, performance, security, and reliability.

      Each attribute should be:
      - Specific
      - Quantitative
      - Verifiable

  - sectionKey: "I18N_L10N"
    title: "Internationalization and Localization Requirements"
    type: "RICH_TEXT"
    guidance: |
      Describe requirements related to internationalization and localization.

      Examples include:
      - Language support
      - Date and number formats
      - Cultural and legal considerations

  - sectionKey: "OTHER_REQUIREMENTS"
    title: "Other Requirements"
    type: "RICH_TEXT"
    guidance: |
      Capture any additional requirements not covered elsewhere.

      Examples:
      - Legal or regulatory requirements
      - Logging and audit requirements
      - Financial or compliance constraints
