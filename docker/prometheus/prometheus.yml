scrape_configs:
  - job_name: "project-pulse"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s # how often to scrape
    static_configs:
      # host.docker.internal resolves to the host from inside the container on Docker Desktop
      # (Windows and macOS). The backend runs on port 80 on the host, not in compose.
      - targets: ["host.docker.internal:80"]
    # Every actuator endpoint except health and info requires ROLE_admin, so an anonymous scrape
    # gets 401 and the dashboards stay empty. To scrape locally, log in as the seeded admin
    # (POST /api/v1/users/login), paste data.token below, uncomment, and restart Prometheus
    # (docker-compose restart prometheus). The token expires after 2 hours and on every backend
    # restart, because the signing key is regenerated at startup.
    # authorization:
    #   type: Bearer
    #   credentials: "<paste the admin token here>"
# Production is not scraped from here at all: nothing scrapes it yet, which is why the deployed
# profiles do not expose the prometheus endpoint. See TD-prod-observability in docs/design/architectural-design.md.
