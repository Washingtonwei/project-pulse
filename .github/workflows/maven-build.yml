# Pull request checks: backend build, tests, and static analysis; frontend static analysis; Dockerfile lint.
# Actions are pinned to commit SHAs (the tag in the comment), so a moved tag cannot change what runs.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      # verify = package (compile, tests) plus SpotBugs and PMD, which fail on findings not in backend/config/*-baseline.*
      - name: Build, test, and analyze with Maven
        working-directory: ./backend
        run: mvn --batch-mode verify

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      # Report only for now: none of the three passes on main yet (ESLint 130 problems, vue-tsc 18 errors,
      # Prettier 76 files). Each step becomes blocking once its findings are baselined or fixed.
      - name: ESLint (report only)
        working-directory: ./frontend
        continue-on-error: true
        run: npm run lint:check
      - name: Type check (report only)
        working-directory: ./frontend
        continue-on-error: true
        run: npm run type-check
      - name: Prettier (report only)
        working-directory: ./frontend
        continue-on-error: true
        run: npx prettier --check src/

  dockerfile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint the Dockerfile with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
